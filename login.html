<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Scrambling the Code</title>
  <link rel="stylesheet" href="custom.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light sticky-top bg-white shadow">
    <div class="container">
      <a class="navbar-brand" href="index.html"><i class="bi bi-code-slash"></i> Scrambling the Code</a>
    </div>
  </nav>
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card shadow-lg border-0 rounded-4">
          <div class="card-header bg-primary text-white text-center py-4 rounded-top-4">
            <h3>Login</h3>
          </div>
          <div class="card-body p-5">
            <form id="loginForm">
              <div class="mb-3">
                <label for="loginEmail" class="form-label">Email</label>
                <input type="email" class="form-control" id="loginEmail" required>
              </div>
              <div class="mb-3">
                <label for="loginPassword" class="form-label">Password</label>
                <input type="password" class="form-control" id="loginPassword" required>
              </div>
              <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>
            <hr>
            <div class="text-center">Don't have an account? <a href="signup.html">Sign up</a></div>
            <div id="alertMessage" class="alert mt-3 d-none"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    function showAlert(message, type) {
      const alertDiv = document.getElementById('alertMessage');
      alertDiv.className = `alert alert-${type} mt-3`;
      alertDiv.innerHTML = message;
      alertDiv.classList.remove('d-none');
      setTimeout(() => { alertDiv.classList.add('d-none'); }, 4000);
    }
    function handleLogin(event) {
      event.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      if (!email || !password) { showAlert('Please fill in all fields.', 'danger'); return; }
      const users = JSON.parse(localStorage.getItem('users') || "[]");
      const found = users.find(u => u.email === email && u.password === password);
      if (!found) { showAlert('Invalid email or password.', 'danger'); return; }
      localStorage.setItem('currentUser', JSON.stringify(found));
      showAlert('Login successful! Redirecting...', 'success');
      setTimeout(() => { window.location.href = 'index.html'; }, 1200);
    }
    document.getElementById('loginForm').addEventListener('submit', handleLogin);
  </script>
</body>
</html>
