<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up - Scrambling the Code</title>
  <link rel="stylesheet" href="custom.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light sticky-top bg-white shadow">
    <div class="container">
      <a class="navbar-brand" href="index.html"><i class="bi bi-code-slash"></i> Scrambling the Code</a>
    </div>
  </nav>
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow-lg border-0 rounded-4">
          <div class="card-header bg-success text-white text-center py-4 rounded-top-4">
            <h3>Sign Up</h3>
          </div>
          <div class="card-body p-5">
            <form id="signupForm">
              <div class="mb-3">
                <label for="signupName" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="signupName" required>
              </div>
              <div class="mb-3">
                <label for="signupEmail" class="form-label">Email</label>
                <input type="email" class="form-control" id="signupEmail" required>
              </div>
              <div class="mb-3">
                <label for="signupPhone" class="form-label">Phone</label>
                <input type="text" class="form-control" id="signupPhone" required>
              </div>
              <div class="mb-3">
                <label for="signupPassword" class="form-label">Password</label>
                <input type="password" class="form-control" id="signupPassword" required>
              </div>
              <div class="mb-3">
                <label for="signupConfirmPassword" class="form-label">Confirm Password</label>
                <input type="password" class="form-control" id="signupConfirmPassword" required>
              </div>
              <button type="submit" class="btn btn-success w-100">Create Account</button>
            </form>
            <hr>
            <div class="text-center">Already have an account? <a href="login.html">Login</a></div>
            <div id="alertMessage" class="alert mt-3 d-none"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    function showAlert(message, type) {
      const alertDiv = document.getElementById('alertMessage');
      alertDiv.className = `alert alert-${type} mt-3`;
      alertDiv.innerHTML = message;
      alertDiv.classList.remove('d-none');
      setTimeout(() => { alertDiv.classList.add('d-none'); }, 4000);
    }
    function handleSignup(event) {
      event.preventDefault();
      const name = document.getElementById('signupName').value.trim();
      const email = document.getElementById('signupEmail').value.trim();
      const phone = document.getElementById('signupPhone').value.trim();
      const password = document.getElementById('signupPassword').value;
      const confirmPassword = document.getElementById('signupConfirmPassword').value;
      if (!name || !email || !phone || !password || !confirmPassword) {
        showAlert('Please fill in all fields.', 'danger');
        return;
      }
      if (password !== confirmPassword) {
        showAlert('Passwords do not match!', 'danger');
        return;
      }
      if (password.length < 4) {
        showAlert('Password must be at least 4 characters long.', 'danger');
        return;
      }
      const users = JSON.parse(localStorage.getItem('users') || "[]");
      if (users.find(u => u.email === email)) {
        showAlert('This email is already registered.', 'danger');
        return;
      }
      users.push({ name, email, phone, password });
      localStorage.setItem('users', JSON.stringify(users));
      showAlert('Account created successfully! Redirecting...', 'success');
      setTimeout(() => { window.location.href = 'login.html'; }, 1200);
    }
    document.getElementById('signupForm').addEventListener('submit', handleSignup);
  </script>
</body>
</html>
